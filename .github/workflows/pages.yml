name: Deploy Pages

# Manual-only safety valve for redeploying docs/ without rerunning the whole
# collection. The real automatic deploy now happens inline at the end of
# collect.yml, because a push trigger here never actually fires: commits
# pushed with the default GITHUB_TOKEN (which collect.yml uses) don't trigger
# other workflows - that's a deliberate anti-recursion rule in GitHub Actions,
# not a bug. A `push` trigger on this file would look correct and just silently
# never run.
on:
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deployment
        uses: actions/deploy-pages@v4
